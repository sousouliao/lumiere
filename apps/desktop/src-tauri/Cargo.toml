[package]
name = "lumiere-desktop"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "Lumiere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["native-tls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
lumiere-capture-contract.workspace = true
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[lints]
workspace = true
