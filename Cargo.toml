[workspace]
members = ["crates/capture-contract", "crates/capture-windows", "hosts/windows", "apps/desktop/src-tauri", "tools/windows-installer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
lumiere-capture-contract = { path = "crates/capture-contract" }
lumiere-capture-windows = { path = "crates/capture-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
