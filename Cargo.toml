[workspace]
members = ["crates/capture-contract", "crates/capture-windows", "hosts/windows", "apps/desktop/src-tauri", "tools/windows-installer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
lumiere-capture-contract = { path = "crates/capture-contract" }
lumiere-capture-windows = { path = "crates/capture-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep the shell debuggable without making full-resolution capture/PNG work run
# unoptimized. These overrides do not change the release profile or image semantics.
[profile.dev.package.lumiere-capture-windows]
opt-level = 3

[profile.dev.package.half]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3
