name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Restore, build, test, and format
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install shell dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared shell
        shell: bash
        run: |
          pnpm check
          pnpm test:shared
          pnpm build

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Build native release shell and Host
        run: pnpm --filter @lumiere/desktop build:native

      - name: Verify Rust workspace
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --features lumiere-desktop/custom-protocol -- -D warnings
          cargo test --locked --workspace --features lumiere-desktop/custom-protocol
          cargo build --locked -p lumiere-windows-host
          node scripts/verify-rust-protocol.mjs
