name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit release metadata and shared shell
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      windows: ${{ steps.metadata.outputs.windows }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Releases must be dispatched from main."
          exit 1

      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate finalized release metadata
        run: pnpm release:check -- --publishing

      - name: Inspect release metadata
        id: metadata
        run: pnpm release:inspect -- --github-output "$GITHUB_OUTPUT"

      - name: Require a new release and matching baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          remote_tag="$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG points to $target instead of $GITHUB_SHA."
              exit 1
            fi
          fi
          existing="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            is_draft="$(printf '%s' "$existing" | jq -r '.isDraft')"
            is_prerelease="$(printf '%s' "$existing" | jq -r '.isPrerelease')"
            target="$(printf '%s' "$existing" | jq -r '.targetCommitish')"
            if [ "$is_draft" != "true" ] || [ "$is_prerelease" != "${{ steps.metadata.outputs.prerelease }}" ] || [ "$target" != "$GITHUB_SHA" ]; then
              echo "Release $RELEASE_TAG already exists or targets a different commit."
              exit 1
            fi
          fi
          latest_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          node ./scripts/release-metadata.mjs baseline --latest-tag "$latest_tag"

      - name: Verify shared shell
        run: |
          pnpm check
          pnpm test:shared
          pnpm build

      - name: Generate release notes
        run: pnpm release:notes -- --output artifacts/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error

  windows:
    name: Build Windows release
    needs: audit
    if: needs.audit.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Verify Rust workspace
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --features lumiere-desktop/custom-protocol -- -D warnings
          cargo test --locked --workspace --features lumiere-desktop/custom-protocol
          cargo build --locked -p lumiere-windows-host
          node scripts/verify-rust-protocol.mjs

      - name: Build Windows installer and signed updater metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Tauri updater signing key is required.' }
          pnpm package:windows

      - name: Verify updater signatures against the embedded public key
        shell: pwsh
        run: cargo test --locked -p lumiere-desktop --features custom-protocol official_updater_accepts_signed_bytes_and_rejects_tampering -- --ignored --nocapture

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            artifacts/windows/release/Lumiere-Setup-*-x64.exe
            artifacts/windows/release/latest.yml
            artifacts/windows/release/latest.json
            artifacts/windows/release/*.exe.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [audit, windows]
    if: >-
      always() &&
      needs.audit.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: false
          install: false

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: artifacts/metadata

      - name: Download Windows artifacts
        if: needs.audit.outputs.windows == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: artifacts/publish

      - name: Generate unified checksum manifest
        run: node ./scripts/release-metadata.mjs checksums --directory artifacts/publish --output artifacts/publish/SHA256SUMS

      - name: Create or recover draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.audit.outputs.version }}
          RELEASE_TITLE: Lumiere ${{ needs.audit.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.audit.outputs.prerelease }}
        shell: bash
        run: |
          remote_tag="$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            target="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG points to $target instead of $GITHUB_SHA."
              exit 1
            fi
          fi

          existing="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            is_draft="$(printf '%s' "$existing" | jq -r '.isDraft')"
            is_prerelease="$(printf '%s' "$existing" | jq -r '.isPrerelease')"
            target="$(printf '%s' "$existing" | jq -r '.targetCommitish')"
            if [ "$is_draft" != "true" ] || [ "$is_prerelease" != "$RELEASE_PRERELEASE" ] || [ "$target" != "$GITHUB_SHA" ]; then
              echo "Release $RELEASE_TAG is public or targets a different commit."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file artifacts/metadata/release-notes.md --draft
            gh release upload "$RELEASE_TAG" artifacts/publish/* --clobber
          else
            flags=(--draft)
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" artifacts/publish/* "${flags[@]}" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file artifacts/metadata/release-notes.md
          fi

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.audit.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.audit.outputs.prerelease }}
        shell: bash
        run: |
          expected="$(find artifacts/publish -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Published asset set does not match the staged release set."
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
