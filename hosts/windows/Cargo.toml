[package]
name = "lumiere-windows-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lumiere-windows-host"
path = "rust/main.rs"

[lib]
path = "rust/lib.rs"

[dependencies]
lumiere-capture-contract.workspace = true
lumiere-capture-windows.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
png = "0.18"
